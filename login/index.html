<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | Properti Villa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
  
<body>

  <a href="https://www.youtube.com./embed/dQw4w9WgXcQ?autoplay=1&start=1" class="floating-btn-yt" target="_blank">
    <i class="fab fa-youtube"></i>
  </a>

  <div class="wrapper">
  <form id="loginForm">
    <h2>Masuk</h2>
    <div class="input-field">
      <input type="text" id="username" required>
      <label>Masukkan nama pengguna Anda</label>
    </div>
    <div class="input-field">
      <input type="password" id="password" required>
      <label>Masukkan kata sandi</label>
    </div>
    <div class="forget">
      <label for="remember">
        <input type="checkbox" id="remember">
        <p>Ingat saya</p>
      </label>
      <a href="#">Lupa kata sandi?</a>
    </div>
    <button type="submit">Masuk Sekarang</button>
    <div class="register">
      <p>Belum punya akun? <a href="#">Daftar</a></p>
    </div>
  </form>
</div>

  <script>
  const loginForm = document.getElementById('loginForm');
  
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault(); // Menghentikan refresh halaman saat tombol ditekan

    // Mengambil nilai input username dan password
    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value;

    // Batasan Khusus: Hanya menerima username "heri" dan password "123"
    if (usernameInput === "heri" && passwordInput === "123") {
      
      // Simpan status ke memori browser (localStorage) agar dibaca semua menu
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("userName", "Heri"); // Disimpan dengan huruf kapital "Heri"

      alert("Login Berhasil! Selamat datang, Heri.");
      
      // Pindah ke halaman utama Beranda
      window.location.href = "../index.html"; 
    } else {
      // Jika yang dimasukkan bukan heri / 123
      alert("Gagal Masuk! Username atau Password salah.");
    }
  });
</script>
  
</body>
</html>
